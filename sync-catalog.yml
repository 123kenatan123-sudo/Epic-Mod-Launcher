name: Sync Mod Catalog from Discord

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Discord forum posts to catalog.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_GUILD_ID: '1566032190062727399'
          DISCORD_FORUM_CHANNEL_ID: '1566035062443610122'
          ASSET_RELEASE_TAG: 'catalog-assets'
        run: python3 scripts/sync_discord_catalog.py

      - name: Commit updated catalog.json
        run: |
          if [ -n "$(git status --porcelain catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "chore: sync mod catalog from Discord"
            git push
          else
            echo "catalog.json is up to date."
          fi
